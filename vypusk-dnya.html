<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Випуск дня · Daily Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#c9c6bd;--paper:#ebe8df;--ink:#111;--mute:#5d5a52;--line:#9c988c;--accent:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0d;--paper:#1a1916;--ink:#ece8dc;--mute:#9a968a;--line:#4a473f;--accent:#ece8dc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0d;--paper:#1a1916;--ink:#ece8dc;--mute:#9a968a;--line:#4a473f;--accent:#ece8dc;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Source Serif 4",Georgia,serif;-webkit-text-size-adjust:100%}
.stage{max-width:620px;margin:0 auto;padding:14px 14px 28px;overflow-x:hidden}
.top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.top button{font:600 14px "Source Serif 4",Georgia,serif;min-width:44px;min-height:36px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;cursor:pointer}
.top button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.wrap{position:relative}
.sheet{background:var(--paper);padding:22px 20px 22px;border-radius:1px;box-shadow:0 10px 34px rgba(0,0,0,.25);transform-origin:50% 35%;hyphens:auto;-webkit-hyphens:auto}
.sheet.abs{position:absolute;left:0;right:0;top:0;z-index:5;will-change:transform,filter}
.sheet h1{font:800 clamp(38px,12vw,58px)/1 "Playfair Display",Georgia,serif;margin:0 0 6px;letter-spacing:-.02em;text-align:center}
.sub{text-align:center;font-style:italic;font-size:14px;color:var(--mute);margin-bottom:10px}
.meta{display:flex;justify-content:space-between;color:var(--ink);font-size:13px;font-style:italic;padding:6px 0;border-top:4px double var(--ink);border-bottom:1px solid var(--ink);margin-bottom:4px}
article{position:relative;padding:20px 0;border-bottom:2px solid var(--ink);overflow:hidden}
.bg{position:absolute;right:-14px;top:4px;width:170px;height:170px;opacity:.11;pointer-events:none;color:var(--ink)}
article:last-of-type{border-bottom:0}
article h2{position:relative;font:800 27px/1.12 "Playfair Display",Georgia,serif;margin:0 0 8px;letter-spacing:-.01em}
article p{position:relative;margin:0 0 12px;text-align:justify}
.body::first-letter{float:left;font:800 3.3em/.82 "Playfair Display",Georgia,serif;padding:5px 7px 0 0}
article .lead{font-style:italic;font-weight:600;text-align:left}
article .why{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0;font-size:15px;text-align:left;clear:both}
.why b{font-style:italic}
.sheet footer{color:var(--mute);font-size:13px;font-style:italic;padding-top:10px;border-top:1px solid var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{flex:1;font:600 16px "Source Serif 4",Georgia,serif;min-height:48px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:12px 0 0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="crumple" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="n"/>
<feDisplacementMap id="dm" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" result="d"/>
<feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="4" result="l"><feDistantLight azimuth="40" elevation="80"/></feDiffuseLighting>
<feComposite in="d" in2="l" operator="arithmetic" k1="1" k2="0" k3="0" k4="0"/>
</filter></defs></svg>

<main class="stage">
<div class="top"><button data-l="uk" aria-pressed="true">UA</button><button data-l="en" aria-pressed="false">EN</button></div>
<div class="wrap" id="wrap"></div>
<div class="nav"><button id="prev"></button><button id="next"></button></div>
<p class="hint" id="hint"></p>
</main>

<script>
const T={
uk:{name:`Випуск дня`,sub:`Щоденна газета про технології та біоінженерію`,no:`Випуск №`,why:`Чому це важливо`,prev:`Попередній`,next:`Наступний день`,hint:`Свайпни або натисни кнопку: сторінка зімнеться, як газета`,foot:`Тестовий випуск. У робочій версії тут будуть посилання на джерела.`},
en:{name:`Daily Edition`,sub:`A daily paper on technology and bioengineering`,no:`Issue No. `,why:`Why it matters`,prev:`Previous`,next:`Next day`,hint:`Swipe or tap a button: the page crumples like a newspaper`,foot:`Test issue. In the live version, source links will appear here.`}};

const D=[
{d:`2026-11-09`,a:[
{uk:{t:`Генетичний «олівець»: виправляти ДНК без розрізів`,l:`Метод prime editing замінює помилкову «літеру» в ДНК, не розрізаючи обидва ланцюги.`,b:`Класичний CRISPR працює як ножиці: розрізає ДНК, а клітина сама лагодить розріз, і не завжди точно. Prime editing більше схожий на олівець із гумкою: він знаходить потрібне місце й переписує його за заданим зразком. Через це менше ризик випадкових помилок.`,w:`Так можна лікувати хвороби, які спричинені однією неправильною літерою в генах.`},
en:{t:`A genetic pencil: fixing DNA without cutting it`,l:`Prime editing swaps a faulty letter in DNA without cutting both strands.`,b:`Classic CRISPR works like scissors: it cuts the DNA and lets the cell repair the break, not always accurately. Prime editing is closer to a pencil with an eraser: it finds the right spot and rewrites it from a template. That lowers the risk of accidental errors.`,w:`It could treat diseases caused by a single wrong letter in a gene.`}},
{uk:{t:`ШІ проєктує білки, яких немає в природі`,l:`Нейромережі вже вміють створювати нові білки під заздалегідь задане завдання.`,b:`Раніше вчені роками добирали форму білка вручну. Тепер модель пропонує тисячі варіантів за хвилини, а лабораторія перевіряє лише найперспективніші. Так шукають нові ліки, ферменти для переробки пластику та вакцини.`,w:`Розробка нових ліків може стати швидшою й дешевшою.`},
en:{t:`AI designs proteins that don’t exist in nature`,l:`Neural networks can now create new proteins for a goal set in advance.`,b:`Scientists used to tune a protein’s shape by hand for years. Now a model suggests thousands of options in minutes, and the lab tests only the most promising ones. This is how new drugs, plastic-eating enzymes and vaccines are explored.`,w:`Drug development could become faster and cheaper.`}}]},
{d:`2026-11-10`,a:[
{uk:{t:`Органоїди: міні-органи для перевірки ліків`,l:`З клітин людини в лабораторії вирощують крихітні «копії» органів.`,b:`Це шматочки тканини завбільшки з горошину: міні-мозок, міні-кишківник, міні-печінка. На них перевіряють, як діятимуть ліки, не ризикуючи пацієнтом. Метод також зменшує потребу в дослідах на тваринах.`,w:`Лікування можна буде підбирати під конкретну людину.`},
en:{t:`Organoids: mini organs for testing drugs`,l:`Tiny “copies” of organs are grown in the lab from human cells.`,b:`These are pea-sized pieces of tissue: a mini brain, mini gut, mini liver. Drugs are tested on them without risking a patient. The method also reduces the need for animal experiments.`,w:`Treatment could be matched to each individual person.`}},
{uk:{t:`Мозок і комп’ютер: сигнал замість клавіатури`,l:`Імплантати вже допомагають паралізованим людям керувати курсором і писати текст думкою.`,b:`Крихітні електроди зчитують сигнали нейронів, а програма перетворює їх на команди. ШІ допомагає розпізнавати наміри людини дедалі точніше. Технологія ще експериментальна й потребує операції, тож до масового використання далеко.`,w:`Це шанс повернути спілкування й самостійність людям із тяжкими травмами.`},
en:{t:`Brain and computer: signals instead of a keyboard`,l:`Implants already help paralyzed people move a cursor and type with thought alone.`,b:`Tiny electrodes read neuron signals, and software turns them into commands. AI helps recognize a person’s intent more and more precisely. The technology is still experimental and needs surgery, so mass use is far off.`,w:`It offers a chance to restore communication and independence to people with severe injuries.`}}]}
];

const svg=x=>`<svg class="bg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">${x}</svg>`;
const ART=[
svg(`<path d="M35 4C85 22 85 40 50 50S15 78 65 96"/><path d="M65 4C15 22 15 40 50 50S85 78 35 96"/><path d="M44 10h12M36 18h28M30 28h40M36 40h28M36 60h28M30 72h40M36 82h28M44 90h12"/>`),
svg(`<path d="M50 20L76 35L76 65L50 80L24 65L24 35Z"/><path d="M50 50L50 20M50 50L76 35M50 50L76 65M50 50L50 80M50 50L24 65M50 50L24 35"/><circle cx="50" cy="50" r="9"/><circle cx="50" cy="20" r="6"/><circle cx="76" cy="35" r="6"/><circle cx="76" cy="65" r="6"/><circle cx="50" cy="80" r="6"/><circle cx="24" cy="65" r="6"/><circle cx="24" cy="35" r="6"/>`),
svg(`<circle cx="40" cy="45" r="22"/><circle cx="64" cy="54" r="18"/><circle cx="50" cy="74" r="14"/><circle cx="28" cy="72" r="10"/><circle cx="34" cy="40" r="4"/><circle cx="46" cy="52" r="3"/><circle cx="66" cy="50" r="4"/><circle cx="50" cy="72" r="3"/>`),
svg(`<circle cx="50" cy="50" r="8"/><path d="M50 42L50 20M50 28L38 14M50 28L62 12M56 54L80 64M72 60L86 50M72 60L84 76M44 54L22 66M30 61L14 56M30 61L18 78"/>`)];
const $=id=>document.getElementById(id),wrap=$('wrap');
let L='uk',i=0,busy=false,cur=null;
try{const s=localStorage.getItem('lang');if(s==='uk'||s==='en')L=s}catch(e){}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function fmt(d){return new Intl.DateTimeFormat(L==='uk'?'uk-UA':'en-US',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function mk(n){const t=T[L],d=D[n],s=document.createElement('section');s.className='sheet';
s.innerHTML=`<header><h1>${t.name}</h1><div class="sub">${t.sub}</div><div class="meta"><span>${fmt(d.d)}</span><span>${t.no}${n+1}</span></div></header>`+
d.a.map((a,k)=>{const x=a[L];return `<article>${ART[n*2+k]}<h2>${x.t}</h2><p class="lead">${x.l}</p><p class="body">${x.b}</p><p class="why"><b>${t.why}.</b> ${x.w}</p></article>`}).join('')+`<footer>${t.foot}</footer>`;return s}

function bar(){const t=T[L];$('prev').textContent=t.prev;$('next').textContent=t.next;$('hint').textContent=t.hint;
$('prev').disabled=i===0;$('next').disabled=i===D.length-1;document.documentElement.lang=L;
document.querySelectorAll('.top button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L))}

function anim(el,a,b,cb){const dm=document.getElementById('dm'),W=el.offsetWidth,H=innerHeight,t0=performance.now(),dur=reduce?1:1000;
function ap(t){const u=t*t;dm.setAttribute('scale',150*t);
el.style.transform=`translate(${-W*.35*u}px,${H*.45*u}px) scale(${1-.9*u}) rotate(${-28*u}deg)`;
el.style.opacity=Math.min(1,(1-t)*6)}
el.style.filter='url(#crumple)';ap(a);
(function f(now){const p=Math.min(1,(now-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;ap(a+(b-a)*e);
if(p<1)requestAnimationFrame(f);else{el.style.filter='';el.style.transform='';el.style.opacity='';cb()}})(t0)}

function go(dir){const n=i+dir;if(busy||n<0||n>=D.length)return;busy=true;scrollTo(0,0);const nx=mk(n);
if(dir>0){cur.classList.add('abs');wrap.append(nx);anim(cur,0,1,()=>{cur.remove();cur=nx;i=n;busy=false;bar()})}
else{nx.classList.add('abs');wrap.append(nx);anim(nx,1,0,()=>{nx.classList.remove('abs');cur.remove();cur=nx;i=n;busy=false;bar()})}}

function setLang(l){if(busy||l===L)return;L=l;try{localStorage.setItem('lang',l)}catch(e){}
const nx=mk(i);cur.replaceWith(nx);cur=nx;bar()}

$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
document.querySelectorAll('.top button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
let sx=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(dx<-70)go(1);else if(dx>70)go(-1)},{passive:true});

cur=mk(0);wrap.append(cur);bar();
</script>
</body>
</html>
